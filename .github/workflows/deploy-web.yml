# Publishes the studio to Firebase Hosting, at https://manostudio-app.web.app (the Hosting site named
# by the repository variable FIREBASE_SITE, default "manostudio-app", in the project FIREBASE_PROJECT_ID),
# on every push to main. Until that site can be used, it keeps publishing to the project's first
# address, so the site stays up to date; once it is live there, the first address is taken offline.
# One-time setup: docs/DEPLOY.md (a Firebase project, and its service account key saved as the
# repository secret FIREBASE_SERVICE_ACCOUNT). Without the secret, the site is built but not published.
name: Deploy web studio

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      PROJECT: ${{ vars.FIREBASE_PROJECT_ID || 'pictogen-daab2' }}
      SITE: ${{ vars.FIREBASE_SITE || 'manostudio-app' }} # the address: https://<SITE>.web.app
      OLD_SITE: pictogen-daab2 # the first address, taken offline once the new one is live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Quick checks
        run: node scripts/smoke-test.js && node scripts/test-timeline.js && node scripts/test-styles.js
      - name: Build the static site
        run: node scripts/build-web.js
      - name: Firebase sign-in for the site steps
        if: env.HAS_KEY == 'true'
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$KEY" > "$RUNNER_TEMP/firebase-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-key.json" >> "$GITHUB_ENV"
      - name: Choose the site (the new address, created the first time; else the first one)
        id: site
        if: env.HAS_KEY == 'true'
        run: |
          use="$SITE"
          if npx --yes firebase-tools@13 hosting:sites:get "$SITE" --project "$PROJECT" > /dev/null 2>&1; then
            echo "The site $SITE is there."
          elif ! npx --yes firebase-tools@13 hosting:sites:create "$SITE" --project "$PROJECT" --non-interactive; then
            use="$OLD_SITE"
            echo "::warning::The address https://$SITE.web.app can't be used by the project $PROJECT (see the error above; docs/DEPLOY.md, 'The address'). Publishing to https://$OLD_SITE.web.app for now."
          fi
          node -e "const f='firebase.json',c=JSON.parse(require('fs').readFileSync(f));c.hosting.site=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(c,null,2))" "$use"
          echo "site=$use" >> "$GITHUB_OUTPUT"
      - name: Publish to Firebase Hosting
        if: env.HAS_KEY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.PROJECT }}
          channelId: live
      - name: Take the old address offline
        if: env.HAS_KEY == 'true' && steps.site.outputs.site != env.OLD_SITE
        continue-on-error: true # (a key from another project may not be allowed to; then do it in the console)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://$OLD_SITE.web.app/" || true)
          if [ "$code" = "200" ]; then
            npx --yes firebase-tools@13 hosting:disable --site "$OLD_SITE" --project "$PROJECT" --force
            echo "https://$OLD_SITE.web.app is offline now; the studio is at https://$SITE.web.app"
          else
            echo "https://$OLD_SITE.web.app is already offline ($code)."
          fi
